services:
  web:
    build: .
    container_name: django_app
    env_file:
      - .env
    # Le conteneur partage le réseau de l'hôte : il atteint Postgres/Mongo
    # de l'hôte sur localhost, sans toucher au firewall ni au bind des DB.
    network_mode: host
    # gunicorn écoute en local uniquement ; le nginx de l'hôte proxy dessus.
    command: gunicorn --bind 127.0.0.1:8010 --workers 3 ECORIDE.wsgi:application
    volumes:
      # Bind mounts alignés sur les chemins que nginx sert et sur les
      # STATIC_ROOT (/app/staticfiles) / MEDIA_ROOT (/app/main/media) de Django.
      - ./staticfiles:/app/staticfiles
      - ./main/media:/app/main/media
      - ./logs:/app/logs
    restart: unless-stopped