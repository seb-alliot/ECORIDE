{% load static %}

<form id="filtre_form" method="GET">
    <div class="form-group">
        <label for="note">Note du chauffeur</label>
        {{ filtre_form.note }}
    </div>
    <div class="form-group">
        <label for="temps_trajet">Durée trajet</label>
        {{ filtre_form.temps_trajet }}
    </div>
    <div class="form-group">
        <label for="prix">Prix maximum</label>
        {{ filtre_form.prix }}
    </div>

    <button type="submit" name="form_trajet" value="filtre_form" class="btn btn--secondary">Filtrer la recherche</button>
</form>

<form id="selection_trajet" method="GET" action="{% url 'reservation' %}">
    <div id="reservation_btn" class="form-actions">
        <button type="submit" class="btn btn--primary">Réserver</button>
    </div>
</form>

{% block script_js %}
    <script nonce="{{ request.csp_nonce }}">const urlfiltre_form = "{% url 'filtre_dynamique' %}";</script>
    <script nonce="{{ request.csp_nonce }}" src="{% static 'js/espace_perso/filtre_trajet.js' %}" defer></script>
{% endblock script_js %}
