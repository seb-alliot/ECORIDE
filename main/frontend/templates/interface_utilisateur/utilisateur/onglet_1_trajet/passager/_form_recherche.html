<section class="search">
    <h2 class="search__title" id="recherche_covoiturage">Rechercher un covoiturage</h2>

    <form id="recherche_form" method="GET" class="search__form">
        {% csrf_token %}

        <div class="form-group">
            <label for="ville_depart">Départ</label>
            {{ recherche_form.ville_depart }}
        </div>

        <div class="form-group">
            <label for="ville_arrivee">Arrivée</label>
            {{ recherche_form.ville_arrivee }}
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            {{ recherche_form.date }}
        </div>

        <div class="form-group">
            <label for="chauffeur">Chauffeur</label>
            {{ recherche_form.pseudo }}
        </div>

        <button type="submit" name="form_trajet" value="recherche_form" class="btn btn--primary">Rechercher</button>
    </form>
</section>
