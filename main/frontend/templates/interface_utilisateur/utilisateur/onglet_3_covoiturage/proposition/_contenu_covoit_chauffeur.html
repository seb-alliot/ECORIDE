<li class="trajet-item">
    <input
        type="radio"
        name="trajet_id"
        value="{{ tjt.id }}"
        id="trajet_{{ tjt.id }}"
        class="trajet-radio"
        aria-labelledby="label_trajet_{{ tjt.id }}"
    >
    <label
        class="trajet-card"
        id="label_trajet_{{ tjt.id }}"
        for="trajet_{{ tjt.id }}"
    >
        {% if tjt.chauffeur.adresse_user.photo %}
            <img src="{{ tjt.chauffeur.adresse_user.photo.url }}" alt="Photo de {{ tjt.chauffeur }}" class="driver-photo">
        {% else %}
            <img src="{{ photo_default_url }}" alt="Photo par défaut" class="driver-photo">
        {% endif %}

        <!-- Itinéraire -->
        <div class="trajet-route">
            <div class="route-item">
                <span class="route-icon">📍</span>
                <span class="route-city">{{ tjt.ville_depart }}</span>
            </div>
            <span class="route-arrow">→</span>
            <div class="route-item">
                <span class="route-icon">🏁</span>
                <span class="route-city">{{ tjt.ville_arrivee }}</span>
            </div>
        </div>

        <!-- Informations du trajet -->
        <div class="trajet-info">
            <div class="info-item">
                <span class="icon">📅</span>
                <span class="label">Date</span>
                <span class="value">{{ tjt.date }}</span>
            </div>

            <div class="info-item">
                <span class="icon">🕐</span>
                <span class="label">Heure</span>
                <span class="value">{{ tjt.heure|date:"H\hi" }}</span>
            </div>

            <div class="info-item full-width">
                <span class="icon">🚗</span>
                <span class="label">Voiture</span>
                <span class="value">{{ tjt.voiture.marque }} {{ tjt.voiture.modele }}</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="trajet-footer">
            <div class="trajet-prix">
                <span class="prix-label">Prix</span>
                <span class="prix-value">{{ tjt.prix }} €</span>
            </div>

            <div class="trajet-places">
                {% if tjt.places %}
                    <div class="places-available">
                        <span class="icon">👥</span>
                        <span>{{ tjt.places }} place{{ tjt.places|pluralize }}</span>
                    </div>
                {% else %}
                    <div class="places-full">
                        <span class="icon">👥</span>
                        <span>Complet</span>
                    </div>
                {% endif %}
            </div>

            <span class="statut-badge {{ tjt.etat|lower }}">{{ tjt.etat }}</span>
        </div>

        <!-- Indicateur de sélection -->
        <div class="selection-indicator">
            <span class="checkmark">✓</span>
        </div>
    </label>
</li>
