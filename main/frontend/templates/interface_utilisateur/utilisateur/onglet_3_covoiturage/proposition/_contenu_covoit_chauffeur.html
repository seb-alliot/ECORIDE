<div>
    <li class="resultat class_flex">
        <input
            type="radio"
            name="trajet_id"
            value="{{ tjt.id }}"
            id="trajet_{{ tjt.id }}"
            aria-labelledby="label_trajet_{{ tjt.id }}"
            >
            <label
            id ="covoit_proposer"
            for="trajet_{{ tjt.id }}">
            Trajet : {{ tjt.ville_depart }} -> {{ tjt.ville_arrivee }}<br>
            Le {{ tjt.date }}<br>
            À : {{ tjt.heure|date:"H\H:i" }}<br>
            Voiture :<br> {{ tjt.voiture.marque }} {{ tjt.voiture.modele }}<br>
            Prix : {{ tjt.prix }}€<br>
            Places libres:
            {% if tjt.places %}
            {{ tjt.places }}
            {% else %}
            complet
            {% endif %}<br>
            Etat: {{ tjt.etat }}<br>
            </label>
    </li>
</div>
