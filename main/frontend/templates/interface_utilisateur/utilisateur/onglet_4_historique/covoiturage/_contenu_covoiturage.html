<li class="history-card">
    <div class="history-content">
        <div class="history-header">
            <span class="history-badge {{ tjt.etat|lower }}">{{ tjt.etat }}</span>
        </div>

        <div class="history-route">
            <div class="route-point">
                <span class="icon">📍</span>
                <span>{{ tjt.ville_depart }}</span>
            </div>
            <span class="route-arrow">→</span>
            <div class="route-point">
                <span class="icon">🏁</span>
                <span>{{ tjt.ville_arrivee }}</span>
            </div>
        </div>

        <div class="history-details">
            <div class="detail-item">
                <span class="icon">📅</span>
                <span>{{ tjt.date }}</span>
            </div>
            <div class="detail-item">
                <span class="icon">🕐</span>
                <span>{{ tjt.heure|date:"H\hi" }}</span>
            </div>
        </div>

        <div class="history-car">
            <span class="icon">🚗</span>
            <span>{{ tjt.voiture.marque }} {{ tjt.voiture.modele }}</span>
        </div>

        <div class="history-footer">
            <span class="price">{{ tjt.prix }} €</span>
        </div>
    </div>
</li>
