
<form id="affichage_trajet_form" class="generix1 class_aligne_items_center">
    <div id="aficher_chauffeur">
        <label for="chauffeur">Chauffeur</label>
        {{ affichage_trajet_form.chauffeur }}
    </div>
    <div id="aficher_passager">
    <label for="passager">Passager</label>
    {{ affichage_trajet_form.passager }}
    </div>
    <div id="aficher_trajet">
    <label for="trajet">Trajet concerné</label>
    {{ affichage_trajet_form.trajet }}
    </div>
    <div id="aficher_date_reservation">
    <label for="date_reservation">Date de réservation</label>
    {{ affichage_trajet_form.date_reservation }}
    </div>
</form>

<div class="generix3">
    <form method="POST" id="avis_positif">
        {% csrf_token %}
        <label for="formulaire_avis_positif">Formulaire avis positif :</label><br>
        {{ moderation_positive_form.as_p }}

        <div class="generix3" id="bouton_moderateur">
            <div>
                <button id="ajouter" type="submit" name="action" value="Ajouter" onclick="return confirm('Confirmer l\'ajout ?');">
                    Ajouter
                </button>
            </div>
            <div>
                <button id="refuser" type="submit" name="action" value="Refuser" onclick="return confirm('Confirmer le refus ?');">
                    Refuser
                </button>
            </div>
        </div>
    </form>
</div>
