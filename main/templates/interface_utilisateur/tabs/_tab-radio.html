<!-- factorisation des tabs pour renvoyer celui actif-->
<!-- le block if permet de controler le tab actuel, basé sur 1 par defaut pour les form en get sur le tab 1-->
<input
id="tab-{{ tabId }}"
name="tab-group"
type="radio"
{% if request.GET.tabid|default:"1" == tabId %} checked {% endif %}
/>

<label for="tab-{{ tabId }}">
    {{ tabName }}
</label>
