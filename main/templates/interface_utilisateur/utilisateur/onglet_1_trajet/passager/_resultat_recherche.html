
<form id="selection_trajet" method="GET" action="{% url 'reservation' %}">
    <div class="conteneur_recherche">
        <h2>Covoiturage non écologique</h2>
        <div class="conteneur_recherche2">
        <ul class="resultat">
            {% include "interface_utilisateur/utilisateur/onglet_1_trajet/passager/_resultat_first_result.html" %}
        </div>
    </div>


    <div class="conteneur_recherche">
        <h2>Covoiturage écologique</h2>
        <div class="conteneur_recherche2">
            <ul class="resultat">
                {% include "interface_utilisateur/utilisateur/onglet_1_trajet/passager/_resultat_second_result.html" %}
        </div>
    </div>
    {% if resultat %}
    <div id="bouton_reservation">
        <button type="submit">Réserver</button>
    </div>
    {% endif %}
</form>
