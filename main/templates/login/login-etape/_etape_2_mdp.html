{% load static %}
<link rel="stylesheet" href="{% static 'css/connecte/connection2.css' %}">

<form method="POST"class="connection2 effet_ombre">
    {% csrf_token %}
        <label for="id_Password">Mot de passe</label>
        {{ form.password }}
        {{ form.token_connection}}
        {% if form.non_field_errors %}

        <div class="error">
            {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
        <button type="submit">Se connecter</button>
</form>

    <a href="{% url 'password_reset' %}">Mot de passe oublier ?</a>
</div>
