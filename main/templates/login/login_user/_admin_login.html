{% load static %}

<div>
    <div  id="account-admin" class="class_flex">
        <div>
            <div>
                <a href="{% url 'MonCompte' %}" class="account-link">
                    <div>
                        <img src="{{ adresse_user.photo.url|default:photo_default_url }}" alt="photo de profil" class="photo_profile">
                    </div>
                    <div class="generix1 aligne_item_center">
                        <div>
                            {{ request.user.username }}<br>
                        </div>
                        <div>
                            Crédit : {{ credit.credit|floatformat:2 }} €
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <div>
            <a href="{% url 'moderation_email' %}" class="account-link">
                <img src="{% static 'photo/moderation_email.avif' %}" alt="photo de profil" class="photo_profile">
                <div class="generix1 aligne_item_center">
                    <div>
                            Modération
                        </div>
                        <div class="generix3">
                            emails
                        </div>
                    </div>
            </a>
        </div>

        <div>
            <a href="{% url 'admin:index' %}" class="account-link">
                <div>
                    <div>
                        <img src="{% static 'photo/admin.jpg' %}" alt="photo admin" class="photo_profile">
                    </div>
                    <div class="generix3">
                        Admin
                    </div>
                </div>
            </a>
        </div>

    </div>
    <div id="gain_plateforme">
        Gain de la plateforme : {{ credit.credit|floatformat:2 }} €
    </div>
</div>
