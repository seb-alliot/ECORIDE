

<form method="post" id="reset_mdp">
    {% csrf_token %}
    <div>
        <label for="id_new_password1" class="label-hidden">Nouveau mot de passe</label>
        {{ form.new_password1 }}
    </div>
    <div>
        <label for="id_new_password2" class="label-hidden">Confirmer le mot de passe</label>
        {{ form.new_password2 }}
    </div>
    <button type="submit">Confirmer</button>
</form>
